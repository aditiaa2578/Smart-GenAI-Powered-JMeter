# GenAI JMeter Plugin Configuration
plugin.name=GenAI JMeter Plugin
plugin.version=1.0.0
plugin.description=AI-powered HAR-to-JMX correlation plugin

# Default AI provider (gemini | groq | meta)
ai.provider=groq

# AI API timeouts
ai.timeout.seconds=60
ai.max.tokens=4096
ai.temperature=0.3

# Scanner settings
scanner.min.value.length=6
scanner.max.value.length=4096
scanner.batch.size=10

# Quality thresholds
quality.pass.threshold=0.85
quality.warn.threshold=0.65

# JMX generation defaults
jmx.num.threads=1
jmx.ramp.up=1
jmx.loops=1
